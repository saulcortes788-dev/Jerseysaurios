# Blueprint preparado para Render. Crear este servicio genera cargos en Render.
services:
  - type: web
    name: jerseysaurios
    runtime: python
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:app
    healthCheckPath: /salud
    disk:
      name: jerseysaurios-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: JERSEY_ENV
        value: production
      - key: JERSEY_DATA_DIR
        value: /var/data/jerseysaurios
      - key: JERSEY_TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
