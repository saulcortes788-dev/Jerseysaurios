{% for field,label,placeholder in [('selection','Selección','México, Argentina…'),('league','Liga','Liga MX, LaLiga…'),('brand','Marca','Nike, Adidas…'),('category','Categoría','Local, visitante, retro…')] %}<label>{{ label }}<input name="{{ field }}" value="{{ product[field] if product else '' }}" placeholder="{{ placeholder }}" maxlength="100"></label>{% endfor %}
<label>Foto del jersey<input type="file" name="image" accept="image/jpeg,image/png,image/webp"><small>JPG, PNG o WebP · Formulario hasta 8 MB</small></label><label>Página de origen (opcional)<input type="url" name="source_url" value="{{ product['source_url'] if product else 'https://wavesoccer.x.yupoo.com/albums/70929351?uid=1' }}" placeholder="https://tu-pagina.com/producto" maxlength="200"><small>Referencia para la futura integración.</small></label>

<label class="full-width">Descripción<textarea name="description" maxlength="5000" rows="3">{{ product['description'] if product else '' }}</textarea></label>

<label class="full-width">Categoría jerárquica<select name="category_id"><option value="">Organizar con los datos locales del producto</option>{% for c in category_choices %}<option value="{{ c['id'] }}" {% if product and product['category_id']==c['id'] %}selected{% endif %}>{{ c['label'] }}{{ ' · Inactiva' if not c['effective_active'] else '' }}</option>{% endfor %}</select><small>Asigna la rama exacta. La etiqueta Categoría se conserva como dato anterior.</small></label>
