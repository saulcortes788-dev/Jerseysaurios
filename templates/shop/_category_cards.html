<div class="category-grid category-browser-grid">{% for c in categories %}<a class="category-tile" href="{{ url_for('category_page',category_path=c['path']) }}">{% if c['image_path'] %}<img src="{{ url_for('product_image',filename=c['image_path']) }}" alt="{{ c['name'] }}" loading="lazy">{% else %}<span class="category-symbol" aria-hidden="true">{{ '%02d'|format(loop.index) }}</span>{% endif %}<strong>{{ c['name'] }}</strong><small>{{ c['description'] }}</small>{% if c['credit'] %}<small>{{ c['credit'] }}</small>{% endif %}<span class="category-card-arrow" aria-hidden="true">Explorar →</span></a>{% else %}<p>No hay subcategorías activas.</p>{% endfor %}</div>
