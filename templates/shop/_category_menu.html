<details class="category-navigation" open><summary class="category-navigation-title">Explorar categorías <span aria-hidden="true">☰</span></summary><nav aria-label="Categorías y subcategorías" class="category-tree"><a class="tree-all" href="{{ url_for('category_index') }}">Todas las categorías</a>{% for event,row in category_navigation %}{% if event=='close' %}</div></details>{% elif event=='open' %}<details class="category-branch" {% if current is defined and current and (current['path']==row.path or current['path'].startswith(row.path+'/')) %}open{% endif %}><summary><a href="{{ url_for('category_page',category_path=row.path) }}" {% if current is defined and current and current['id']==row.id %}aria-current="page"{% endif %}>{{ row.name }}</a></summary><div class="category-children">{% else %}<a class="category-leaf" href="{{ url_for('category_page',category_path=row.path) }}" {% if current is defined and current and current['id']==row.id %}aria-current="page"{% endif %}>{{ row.name }}</a>{% endif %}{% endfor %}</nav></details>
