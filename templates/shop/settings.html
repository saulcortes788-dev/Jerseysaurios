{% extends 'base.html' %}{% block content %}<section class="page-head"><div><h1>Configurar tienda</h1><p>Personaliza la presentación y el contacto.</p></div></section><section class="panel"><form method="post" class="product-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Nombre de la tienda<input name="title" value="{{ shop.get('title','') }}" maxlength="100"></label><label>Número de WhatsApp<input name="whatsapp" value="{{ shop.get('whatsapp','') }}" placeholder="52 seguido de 10 dígitos" maxlength="15"><small>Código de país + número, sin + ni espacios.</small></label><label class="full-width">Texto del banner<textarea name="banner" maxlength="250">{{ shop.get('banner','') }}</textarea></label><button class="button primary">Guardar configuración</button></form></section>{% endblock %}
